# Each run's latest client metrics, which the dashboard exposes at /metrics, for Managed
# Service for Prometheus. Scraping never replays the step history; each run that reported in
# the last few hours exposes only its latest step.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: open-rl-run-metrics
spec:
  selector:
    matchLabels:
      app: open-rl-dashboard
  endpoints:
  - port: http
    path: /metrics
    interval: 15s

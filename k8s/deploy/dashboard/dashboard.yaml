# The dashboard as its own process (python -m server.dashboard), so it can be
# restarted, scaled, or broken without touching the API server. It reuses the
# slim API-server image: same dependencies, different entrypoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-rl-dashboard
  labels:
    app: open-rl-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-rl-dashboard
  template:
    metadata:
      labels:
        app: open-rl-dashboard
    spec:
      serviceAccountName: open-rl-sa
      containers:
      - name: dashboard
        image: ghcr.io/gke-labs/open-rl/api-server:latest
        command: ["uv", "run", "python", "-m", "server.dashboard", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: redis://redis-service:6379
        - name: OPEN_RL_WORKER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # GPU metrics: Managed Service for Prometheus through the in-cluster
        # frontend. Unset, the dashboard queries the Cloud Monitoring
        # Prometheus API directly, which needs monitoring.viewer on the SA.
        - name: OPEN_RL_PROMETHEUS_URL
          value: http://gmp-frontend:9090
        readinessProbe:
          httpGet:
            path: /api/v1/dashboard
            port: 8000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: open-rl-dashboard
spec:
  selector:
    app: open-rl-dashboard
  ports:
  - port: 8000
    targetPort: 8000

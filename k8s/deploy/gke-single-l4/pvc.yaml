apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-rl-shared-pvc
  labels:
    app: open-rl
spec:
  accessModes:
    # single-node test overlay; every pod schedules onto the GPU node so RWO is equivalent.
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 100Gi

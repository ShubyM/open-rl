# Managed Prometheus scrapes vLLM's /metrics on every sampler, and each routed
# set's dispatcher pod.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: openrl-samplers
spec:
  selector:
    matchLabels:
      app: open-rl-sampler-worker
  endpoints:
  - port: http
    interval: 15s
---
# Each sampler set's dispatcher pod: the llm-d endpoint picker on 9090 and the
# dispatcher's own queue and retry metrics.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: openrl-sampler-dispatch
spec:
  selector:
    matchLabels:
      app: openrl-sampler-dispatch
  endpoints:
  - port: 9090
    interval: 15s
  - port: metrics
    interval: 15s

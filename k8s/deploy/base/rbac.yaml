# The API server requests one Workload per worker process; the scheduler owns the
# pods and claims from there. It also runs one router Deployment and Service per
# sampler set that uses openrl.sampler_router.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: open-rl-worker-launcher
rules:
- apiGroups: ["openrl.io"]
  resources: ["workloads"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-rl-worker-launcher
subjects:
- kind: ServiceAccount
  name: open-rl-sa
roleRef:
  kind: Role
  name: open-rl-worker-launcher
  apiGroup: rbac.authorization.k8s.io

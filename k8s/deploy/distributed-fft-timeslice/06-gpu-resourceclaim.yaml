# One DRA ResourceClaim for the shared GPU allocation. Every worker or eval pod
# that references this claim is scheduled onto a node that can access the same
# allocated physical GPU.
#
# The claim itself does not serialize CUDA execution or bound how many pods may
# reference it. Run one active GPU workload at a time unless an external
# coordination layer is active.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: open-rl-shared-gpu
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: gpu.nvidia.com

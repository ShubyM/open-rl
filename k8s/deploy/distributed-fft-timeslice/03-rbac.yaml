# The gateway requests one Workload per worker process; the scheduler owns the
# pods and claims from there, so this account needs only the Workload verbs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-rl-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: open-rl-worker-launcher
rules:
- apiGroups: ["openrl.io"]
  resources: ["workloads"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-rl-worker-launcher
subjects:
- kind: ServiceAccount
  name: open-rl-sa
roleRef:
  kind: Role
  name: open-rl-worker-launcher
  apiGroup: rbac.authorization.k8s.io

# Pod template the gateway uses to launch one sampler worker per model
# (server/k8s_worker_manager.py). All sampler worker pods reference the shared
# DRA ResourceClaim open-rl-sampler-gpu-1 (08-sampler-resourceclaim.yaml) and are
# placed onto the sampler GPU node. The node-local snapshot agent time-slices
# GPU access across concurrent inference engines.
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-rl-sampler-worker-pod-template
data:
  sampler-worker-pod.yaml: |
    apiVersion: v1
    kind: Pod
    spec:
      restartPolicy: OnFailure
      containers:
      - name: sampler-worker
        image: gcr.io/open-rl/open-rl-server:latest
        imagePullPolicy: Always
        command: ["uv", "run", "python", "-u", "-m", "server.vllm_sampler"]
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: BASE_MODEL
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: BASE_MODEL
        - name: OPEN_RL_ENABLE_FFT
          value: "false"
        - name: OPEN_RL_TMP_DIR
          value: "/mnt/shared/open-rl"
        - name: HF_HOME
          value: "/mnt/shared/open-rl/huggingface"
        - name: OPEN_RL_SNAPSHOT_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OPEN_RL_SNAPSHOT_AGENT_PORT
          value: "9753"
        resources:
          claims:
          - name: sampler-gpu
          limits:
            memory: "40Gi"
          requests:
            memory: "24Gi"
            cpu: "4"
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
        - name: sampler-vllm-patch-vol
          mountPath: /app/src/server/vllm_sampler.py
          subPath: vllm_sampler.py
        - name: store-patch-vol
          mountPath: /app/src/server/store.py
          subPath: store.py
        - name: time-slicer-patch-vol
          mountPath: /app/src/snapshot_agent/time_slicer.py
          subPath: time_slicer.py
      resourceClaims:
      - name: sampler-gpu
        resourceClaimName: open-rl-sampler-gpu-1
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: open-rl-shared-pvc
      - name: sampler-vllm-patch-vol
        configMap:
          name: sampler-vllm-patch
      - name: store-patch-vol
        configMap:
          name: open-rl-store-patch
      - name: time-slicer-patch-vol
        configMap:
          name: open-rl-time-slicer-patch
      nodeSelector:
        group.timeslice.io/samplers: "true"
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

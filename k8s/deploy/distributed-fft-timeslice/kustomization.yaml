apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# FFT deployment: the gateway creates one Workload per worker process and the
# scheduler turns each into a DRA ResourceClaim and a pod. There is no static
# trainer worker in this variant.
# One namespace for the whole stack. The gateway creates Workloads in its own
# namespace and the scheduler watches its own, and the scheduler runs as the
# open-rl-sa this stack creates, so all three must agree. The scheduler base
# pins openrl-system on its own; this makes the rest of the stack match it.
namespace: openrl-system

resources:
  - 00-llmd-snapshot-agent.yaml
  - 01-shared-pvc.yaml
  - 02-redis.yaml
  - 03-rbac.yaml
  - 04-gateway.yaml
  - 07-accel-timeslicer-daemonset.yaml
  - 10-dcgm-monitoring.yaml
  # The placement controller: the gateway requests workers as Workload
  # objects and this decides which claim each one lands on.
  - ../../../scheduler/deploy/base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: open-rl-config
    literals:
      - BASE_MODEL="Qwen/Qwen2.5-0.5B"
      - ENABLE_GCP_TRACE="1"
      - OPEN_RL_WEIGHT_SYNC_STRATEGY="delta"
      - OPEN_RL_WEIGHT_SYNC_DELTA_FORMAT="vllm_fused"
      - OPEN_RL_WEIGHT_SYNC_DELTA_APPLY_METHOD="patch_in_place"

images:
  - name: ghcr.io/gke-labs/open-rl/server
    newName: gcr.io/cdrollouts-sunilarora/open-rl-server
    newTag: 0.6.18
  - name: ghcr.io/gke-labs/open-rl/gateway
    newName: gcr.io/cdrollouts-sunilarora/open-rl-gateway
    newTag: 0.6.18

replacements:
  - source:
      kind: DaemonSet
      name: open-rl-accel-timeslicer
      fieldPath: spec.template.spec.containers.[name=accel-timeslicer].image
    targets:
      - select:
          kind: Deployment
          name: open-rl-gateway
        fieldPaths:
          - spec.template.spec.containers.[name=gateway].env.[name=OPEN_RL_WORKER_IMAGE].value

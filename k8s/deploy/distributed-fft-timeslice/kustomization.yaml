apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# FFT DRA deployment: the gateway launches one worker pod per FFT model and all
# GPU workloads reference the same DRA ResourceClaim, pinning them to one
# physical GPU allocation. There is no static trainer worker in this variant.
resources:
  - 01-shared-pvc.yaml
  - 02-redis.yaml
  - 03-rbac.yaml
  - 04-gateway.yaml
  - 05-worker-pod-template.yaml
  - 06-gpu-resourceclaim.yaml
  - 07-accel-timeslicer-daemonset.yaml
  - 08-sampler-resourceclaim.yaml
  - 09-sampler-pod-template.yaml
  - 10-dcgm-monitoring.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: open-rl-config
    literals:
      - BASE_MODEL="Qwen/Qwen2.5-0.5B"
      - ENABLE_GCP_TRACE="1"

# The manifests reference the canonical images published by CI
# (ghcr.io/gke-labs/open-rl/*); this transformer pins the deployed version in
# ONE place. To deploy from a private registry or pin a different tag, override
# here — or per-developer without touching committed files via the gitignored
# k8s/deploy/local/ overlay (make deploy-local).
images:
  - name: ghcr.io/gke-labs/open-rl/server
    newTag: latest
  - name: ghcr.io/gke-labs/open-rl/gateway
    newTag: latest

# The images transformer cannot reach OPEN_RL_WORKER_IMAGE (an env string), so
# copy the post-transformer server image from the accel-timeslicer DaemonSet
# into it. Replacements run after the images transformer.
replacements:
  - source:
      kind: DaemonSet
      name: open-rl-accel-timeslicer
      fieldPath: spec.template.spec.containers.0.image
    targets:
      - select:
          kind: Deployment
          name: open-rl-gateway
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=OPEN_RL_WORKER_IMAGE].value

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# FFT DRA deployment: the gateway launches one worker pod per FFT model and all
# GPU workloads reference the same DRA ResourceClaim, pinning them to one
# physical GPU allocation. There is no static trainer worker in this variant.
resources:
  - 01-shared-pvc.yaml
  - 02-redis.yaml
  - 03-rbac.yaml
  - 04-gateway.yaml
  - 05-worker-pod-template.yaml
  - 06-gpu-resourceclaim.yaml
  - 07-accel-timeslicer-daemonset.yaml
  - 08-sampler-resourceclaim.yaml
  - 09-sampler-pod-template.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: open-rl-config
    literals:
      - BASE_MODEL="google/gemma-4-e4b"
      - ENABLE_GCP_TRACE="1"

# The manifests reference the canonical images published by CI
# (ghcr.io/gke-labs/open-rl/*); this transformer pins the deployed version in
# ONE place. Skaffold overrides these values for working-tree deploys.
images:
  - name: ghcr.io/gke-labs/open-rl/server
    newTag: latest
  - name: ghcr.io/gke-labs/open-rl/gateway
    newTag: latest
  - name: ghcr.io/gke-labs/open-rl/timeslicer
    newTag: latest

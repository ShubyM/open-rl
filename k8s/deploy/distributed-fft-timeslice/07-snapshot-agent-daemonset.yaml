# Node-local OpenRL time-slicer. One agent runs on each GPU node, owns the
# acquire/release queue for trainer worker pods placed on that node, and uses
# the llm-d snapshot-agent API for physical checkpoint/restore.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: open-rl-snapshot-agent
  labels:
    app: open-rl-snapshot-agent
spec:
  selector:
    matchLabels:
      app: open-rl-snapshot-agent
  template:
    metadata:
      labels:
        app: open-rl-snapshot-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: group.timeslice.io/trainers
                operator: Exists
            - matchExpressions:
              - key: group.timeslice.io/samplers
                operator: Exists
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: snapshot-agent
        image: gcr.io/open-rl/open-rl-server:latest
        imagePullPolicy: Always
        command: ["uv", "run", "python", "-m", "snapshot_agent.serve"]
        args: ["--listen-host", "0.0.0.0", "--port", "9753", "--backend", "llmd", "--llmd-snapshot-endpoint", "127.0.0.1:9001"]
        ports:
        - name: snapshot
          containerPort: 9753
        resources:
          limits:
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        volumeMounts:
        - name: snapshot-agent-patch-vol
          mountPath: /app/src/snapshot_agent/single_node.py
          subPath: single_node.py
        - name: time-slicer-patch-vol
          mountPath: /app/src/snapshot_agent/time_slicer.py
          subPath: time_slicer.py
      volumes:
      - name: snapshot-agent-patch-vol
        configMap:
          name: open-rl-snapshot-agent-patch
      - name: time-slicer-patch-vol
        configMap:
          name: open-rl-time-slicer-patch

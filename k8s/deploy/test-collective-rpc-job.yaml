apiVersion: batch/v1
kind: Job
metadata:
  name: open-rl-test-collective-rpc
  labels:
    app: open-rl-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: open-rl-test
    spec:
      restartPolicy: Never
      resourceClaims:
        - name: gpu-claim
          resourceClaimName: open-rl-sampler-gpu-1
      containers:
        - name: test-runner
          image: gcr.io/cdrollouts-sunilarora/open-rl-server:0.2.4
          imagePullPolicy: IfNotPresent
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
            - name: VLLM_ALLOW_INSECURE_SERIALIZATION
              value: "1"
          command: ["uv", "run", "python", "-c"]
          args:
            - |
              import asyncio, os, traceback

              # Patch delta_snapshot weight transfer engine
              try:
                  import server.delta_weight_transfer_engine
                  print("[Test] Successfully imported delta_weight_transfer_engine!")
              except Exception as e:
                  print(f"[Test] Import delta_weight_transfer_engine error: {e}")

              def update_weights_rpc(worker):
                  wt = getattr(worker, "weight_transfer_engine", None)
                  print(f"[Worker PID {os.getpid()}] Executing update_weights_rpc on worker! wt={wt}")
                  if wt is not None:
                      return wt.receive_weights({"target_path": "/tmp/dummy", "base_model_path": "Qwen/Qwen3-0.6B"})
                  return f"[Worker PID {os.getpid()}] WeightTransferEngine is None"

              async def main():
                  print("=== ISOLATION TEST: CALLABLE VIA COLLECTIVE_RPC ===")
                  from vllm.engine.arg_utils import AsyncEngineArgs
                  from vllm.engine.async_llm_engine import AsyncLLMEngine

                  engine_args = AsyncEngineArgs(
                      model="Qwen/Qwen3-0.6B",
                      trust_remote_code=True,
                      dtype="bfloat16",
                      max_model_len=512,
                      enforce_eager=True,
                      gpu_memory_utilization=0.3
                  )
                  engine = AsyncLLMEngine.from_engine_args(engine_args)

                  print("\n--- Executing callable function via collective_rpc ---")
                  try:
                      res = await engine.collective_rpc(update_weights_rpc)
                      print(f"collective_rpc(update_weights_rpc) result: {res}")
                  except Exception as e:
                      print(f"collective_rpc error: {e}")
                      traceback.print_exc()

              asyncio.run(main())
          resources:
            claims:
              - name: gpu-claim
          volumeMounts:
            - name: shared-data
              mountPath: /mnt/shared
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: open-rl-shared-pvc

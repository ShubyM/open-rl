apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
  - port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-worker
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      serviceAccountName: open-rl-sa
      containers:
      - name: vllm
        image: ghcr.io/gke-labs/open-rl/server:latest
        imagePullPolicy: Always
        # Pull-mode LoRA sampler: drains the per-base-model sampling queue from
        # Redis (the HTTP vllm_sampler:app entrypoint no longer exists).
        command: ["uv", "run", "python", "-u", "-m", "server.lora_sampler", "--model-id", "$(BASE_MODEL)"]
        env:
        - name: BASE_MODEL
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: BASE_MODEL
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: VLLM_GPU_MEMORY_UTILIZATION
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: VLLM_GPU_MEMORY_UTILIZATION
        - name: VLLM_ARCHITECTURE_OVERRIDE
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: VLLM_ARCHITECTURE_OVERRIDE
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: OPEN_RL_TMP_DIR
          value: "/mnt/shared/open-rl"
        - name: ENABLE_GCP_TRACE
          valueFrom:
            configMapKeyRef:
              name: open-rl-config
              key: ENABLE_GCP_TRACE
        - name: HF_HOME
          value: "/mnt/shared/open-rl/huggingface"
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "32Gi"
          requests:
            nvidia.com/gpu: "1"
            memory: "32Gi"
            cpu: "2"
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: open-rl-shared-pvc
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

# One-off End-to-End (E2E) Training/RL Client Job for Kubernetes.
# This job runs client-side recipes (like fft-gsm8k-rl-x2) inside a cluster pod,
# communicating with the open-rl-gateway service over Kubernetes internal DNS.
#
# The launcher replaces the placeholders and lets Kubernetes generate a unique
# name so runs can overlap.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: open-rl-e2e-
  labels:
    app: open-rl-e2e-client
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: open-rl-e2e-client
    spec:
      restartPolicy: Never
      serviceAccountName: open-rl-sa
      containers:
      - name: e2e-client
        image: E2E-IMAGE
        imagePullPolicy: Always
        args:
        - "scenario=E2E-SCENARIO"
        - "uv_extra=cpu"
        - "base_url=http://open-rl-gateway-service:8000"
        - "E2E-EXTRA-ARGS"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: HF_HOME
          value: "/mnt/shared/open-rl/huggingface"
        resources:
          limits:
            memory: "16Gi"
          requests:
            cpu: "2"
            memory: "8Gi"
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: open-rl-shared-pvc

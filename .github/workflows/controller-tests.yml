name: controller tests

on:
  pull_request:
    paths:
      - "scheduler/controller/**"
      - ".github/workflows/controller-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scheduler/controller/**"
      - ".github/workflows/controller-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scheduler/controller
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: scheduler/controller/go.mod
          cache-dependency-path: scheduler/controller/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

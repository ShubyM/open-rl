[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-rl"
version = "0.1.1"
description = "Open-RL server and training runtime."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "chz>=0.4.0",
    "fastapi",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-gcp-trace",
    "pydantic",
    "redis>=5.0.0",
    "uvicorn",
    "httpx",
    "tqdm>=4.50",
]

[project.optional-dependencies]
cpu = [
    "datasets",
    "numpy",
    "peft",
    "torch",
    "transformers>=5.5.4",
]
gpu = [
    # transformers' Qwen3.5/3.6 GDN fast path gates on causal-conv1d AND the
    # fla kernels together; without it all 48 deltanet layers run the eager
    # torch fallback (2-5x slower training). Building it needs nvcc on PATH
    # or CUDA_HOME.
    "causal-conv1d>=1.4; sys_platform == 'linux'",
    "datasets",
    "flash-linear-attention==0.5.1",
    "numpy",
    "peft",
    "tilelang>=0.1.9; sys_platform == 'linux'",
    "torch; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
    "transformers>=5.5.4",
]
vllm = [
    "torch; sys_platform == 'linux'",
    "torchaudio; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
    "torch-c-dlpack-ext; sys_platform == 'linux'",
    "vllm==0.25.1.dev29+gf378f79b7.cu129; sys_platform == 'linux'",
]
# Kubernetes cluster mode: the k8s API client used to launch FFT worker pods.
cluster = [
    "kubernetes>=29",
    "timeslice @ git+https://github.com/llm-d-incubation/llm-d-rl-time-slicing.git#subdirectory=pkg/client/python",
]
dev = [
    "ruff>=0.5.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["server*", "training*", "accel_timeslicer*"]

[tool.uv.extra-build-dependencies]
# causal-conv1d's setup.py imports torch during metadata/wheel builds. The
# build torch must match the runtime pin - compiling against a newer torch
# ABI and loading under 2.11 breaks at import.
causal-conv1d = ["torch==2.11.0", "setuptools", "packaging", "psutil", "ninja"]

[tool.uv]
override-dependencies = [
    # vLLM still carries an older transformers constraint; keep the project on
    # the newer transformers line declared in our extras.
    "transformers>=5.5.4",
]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
    [
        { extra = "cpu" },
        { extra = "vllm" },
    ],
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/f378f79b7c34d7ca94d53db34837929da2db03ed/cu129"
explicit = true

[tool.uv.sources]
# Pick the torch build from the user-facing cpu/gpu extras; vllm always uses CUDA torch.
torch = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-gpu", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "torch-gpu", extra = "vllm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "torch-gpu", extra = "vllm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "torch-gpu", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "torch-gpu", extra = "vllm", marker = "sys_platform == 'linux'" },
]
vllm = [
    { index = "vllm-cu129", extra = "vllm", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
force-exclude = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "scratch",
    "scratch/**",
]

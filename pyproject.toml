[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-rl"
version = "0.0.1"
description = "Open-RL server and training runtime."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "chz>=0.4.0",
    "fastapi",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-gcp-trace",
    "pydantic",
    "redis>=5.0.0",
    "uvicorn",
    "httpx",
    "tqdm>=4.50",
]

[project.optional-dependencies]
cpu = [
    "cachetools",
    "cbor2",
    "datasets",
    "einops",
    "numpy",
    "openai",
    "openai_harmony",
    "peft",
    "pillow",
    "pybase64",
    "pyzmq",
    "torch",
    "transformers>=5.5.4",
]
gpu = [
    "datasets",
    "flash-linear-attention==0.5.1",
    "numpy",
    "peft",
    "tilelang>=0.1.9; sys_platform == 'linux'",
    "torch; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
    "transformers>=5.5.4",
]
vllm = [
    "torch; sys_platform == 'linux'",
    "torchaudio; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
    "torch-c-dlpack-ext; sys_platform == 'linux'",
    "vllm==0.25.1; sys_platform == 'linux'",
]
# transformers' Qwen3.5/3.6 GDN fast path gates on causal-conv1d AND the fla
# kernels together; without it all 48 deltanet layers run the eager torch
# fallback (2-5x slower training). Building it needs nvcc; it lives in its own
# extra so a compiler problem cannot take the core gpu sync down with it —
# setup_vm.sh attempts it and warns loudly on failure.
fastpath = [
    "causal-conv1d>=1.4; sys_platform == 'linux'",
    "torch; sys_platform == 'linux'",
    # conv1d builds WITHOUT isolation (see tool.uv.no-build-isolation-package)
    # so it compiles against this env's exact torch — its build requirements
    # must therefore live in the env.
    "setuptools; sys_platform == 'linux'",
    "ninja; sys_platform == 'linux'",
    "packaging; sys_platform == 'linux'",
    "psutil; sys_platform == 'linux'",
]
# Kubernetes cluster mode: the k8s API client used to launch FFT worker pods.
cluster = [
    "kubernetes>=29",
    # Kept in step with the snapshot-agent image deployed in
    # docs/setup/gke-fft-timeslice.md: both come from this upstream release.
    "timeslice @ git+https://github.com/llm-d-incubation/llm-d-rl-time-slicing.git@v0.1.0#subdirectory=pkg/client/python",
]
dev = [
    "ruff>=0.5.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["server*", "training*", "accel_timeslicer*"]

[tool.uv]
# causal-conv1d's setup.py imports torch and compiles against its ABI. In an
# isolated build env the torch comes from PyPI (per-extra index mappings don't
# apply there), which can mismatch the cu129 runtime torch. Building without
# isolation compiles against the env's exact torch — mismatch impossible.
no-build-isolation-package = ["causal-conv1d"]
override-dependencies = [
    # vLLM still carries an older transformers constraint; keep the project on
    # the newer transformers line declared in our extras.
    "transformers>=5.5.4",
]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
    [
        { extra = "cpu" },
        { extra = "vllm" },
    ],
    [
        { extra = "cpu" },
        { extra = "fastpath" },
    ],
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.25.1/cu129"
explicit = true

[tool.uv.sources]
# Pick the torch build from the user-facing cpu/gpu extras; vllm always uses CUDA torch.
torch = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-gpu", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "torch-gpu", extra = "vllm", marker = "sys_platform == 'linux'" },
    { index = "torch-gpu", extra = "fastpath", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "torch-gpu", extra = "vllm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "torch-gpu", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "torch-gpu", extra = "vllm", marker = "sys_platform == 'linux'" },
]
vllm = [
    { index = "vllm-cu129", extra = "vllm", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
force-exclude = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "scratch",
    "scratch/**",
]

apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-rl-sa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-check-gateway
  template:
    metadata:
      labels:
        app: dashboard-check-gateway
    spec:
      serviceAccountName: open-rl-sa
      containers:
      - name: gateway
        image: open-rl-dashboard:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: OPEN_RL_SINGLE_PROCESS
          value: "0"
        - name: OPEN_RL_WORKER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OPEN_RL_BUILD_VERSION
          value: "0.6.19.dev30-main-b8c6d3d0"
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /api/v1/healthz
            port: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: dashboard-check-gateway
  ports:
  - port: 8000
    targetPort: 8000
